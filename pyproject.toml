[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "g2opy"
version = "2.1.0"
description="g2o: A General Framework for Graph Optimization"
readme = "README.md"
authors = [
  { name = "Rainer Kuemmerle", email = "rainer.kuemmerle@gmail.com" },
]
requires-python = ">=3.10"

[tool.scikit-build]
cmake.args = [
  "-DBUILD_SHARED_LIBS:=Off",
  "-DG2O_BUILD_PYTHON:=On",
  "-DG2O_BUILD_APPS:=Off",
  "-DG2O_BUILD_EXAMPLES:=Off",
  "-DG2O_USE_OPENGL:=Off"
]
cmake.build-type = "Debug"

wheel.packages = ["python/g2opy"]
messages.after-failure = "Build failed."
build.targets = ["g2opy"]
build.tool-args = ["-j4"]


#[[tool.scikit-build.overrides]]
#if.env = "PERSISTENT_BUILD_DIR"
#if.env.G2O_CACHE_BUILD = true
#build-dir = 

#if.env.G2O_CACHE_BUILD = true
#build-dir = "/tmp/g2opy"

[tool.cibuildwheel]
build-frontend = "build[uv]"

[tool.cibuildwheel.config-settings]
"cmake.build-type" = "Debug"


[tool.cibuildwheel.windows]
# vcpkg's OpenBLAS packages provide import libraries, so leave BLAS linkage dynamic.

[tool.cibuildwheel.windows.environment]
CFLAGS = "/Zi"
CXXFLAGS = "/Zi"
LDFLAGS = "/DEBUG"
CIBW_CMAKE_BUILD_ARGS = "--config Debug"
BLA_VENDOR = "OpenBLAS"
CMAKE_FIND_DEBUG_MODE = "1"

[tool.cibuildwheel.macos]
environment = { CFLAGS="-g", CXXFLAGS="-g" }
cmake.args = [
 "-DCMAKE_BUILD_TYPE=Debug"
]

[tool.cibuildwheel.linux]
before-build = "yum install -y eigen3-devel json-devel"
environment = { CFLAGS="-g", CXXFLAGS="-g" }
cmake.args = [
 "-DCMAKE_BUILD_TYPE=Debug"
]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = "apk add eigen"
# TODO install nlohmann-json

# windows
[[tool.scikit-build.overrides]]
if.platform-system = "^win32"
inherit.cmake.args = "append"
cmake.args = [
 "-DG2O_USE_CHOLMOD:=On",
 "-DG2O_USE_CSPARSE:=On",
 "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake",
 "-DCMAKE_BUILD_TYPE=Debug"
]
build.tool-args = ["-maxcpucount:16"]
cmake.build-type = "Debug"


[[tool.cibuildwheel.overrides]]
select = "*win*"
before-all = [
  '''powershell -NoLogo -NoProfile -Command "$ErrorActionPreference = 'Stop'; vcpkg --triplet x64-windows install eigen3 nlohmann-json suitesparse suitesparse-spqr lapack-reference openblas metis; Write-Host '=== vcpkg list (inside cibuildwheel) ==='; vcpkg list; Write-Host '=== vcpkg owns spqr (inside cibuildwheel) ==='; vcpkg owns spqr; Write-Host '=== suitesparse headers (inside cibuildwheel) ==='; Get-ChildItem -Path C:/vcpkg/installed/x64-windows/include/suitesparse; Write-Host '=== suitesparse SPQR headers (inside cibuildwheel) ==='; Get-ChildItem -Path C:/vcpkg/installed/x64-windows/include -Filter *spqr* -Recurse; Write-Host '=== suitesparse share directory (inside cibuildwheel) ==='; Get-ChildItem -Path C:/vcpkg/installed/x64-windows/share/suitesparse; Write-Host '=== suitesparse CMake packages (inside cibuildwheel) ==='; Get-ChildItem -Path C:/vcpkg/installed/x64-windows/share/suitesparse -Filter *.cmake -Recurse; Write-Host '=== release libraries (inside cibuildwheel) ==='; Get-ChildItem -Path C:/vcpkg/installed/x64-windows/lib; Write-Host '=== release SPQR libraries (inside cibuildwheel) ==='; Get-ChildItem -Path C:/vcpkg/installed/x64-windows/lib -Filter *spqr*.* -Recurse; Write-Host '=== debug libraries (inside cibuildwheel) ==='; Get-ChildItem -Path C:/vcpkg/installed/x64-windows/debug/lib; Write-Host '=== debug SPQR libraries (inside cibuildwheel) ==='; Get-ChildItem -Path C:/vcpkg/installed/x64-windows/debug/lib -Filter *spqr*.* -Recurse; Write-Host '=== relevant environment variables (inside cibuildwheel) ==='; Get-ChildItem Env:BLA*; Get-ChildItem Env:CMAKE*; Get-ChildItem Env:VCPKG*"'''
]
